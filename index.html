    <!-- Legado do GitHub Pages: links antigos no formato /?p=/caminho continuam funcionando.
         No Firebase as rotas já respondem 200 direto (rewrite em firebase.json). -->
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          window.history.replaceState(null, null, decodeURIComponent(p));
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
